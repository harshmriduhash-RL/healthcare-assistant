<!--
  Base layout every other template extends (login, signup, dashboard, chat).
  Defines the HTML skeleton once (charset, viewport, shared stylesheet)
  so individual pages only need to fill in title, content, and scripts blocks
  rather than repeating <head> boilerplate.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Healthcare AI{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Each page's main HTML goes here -->
    {% block content %}{% endblock %}
    <!-- Each page's <script> tags go here, after the body so the DOM
         elements they reference already exist when the scripts run -->
    {% block scripts %}{% endblock %}
</body>
</html>
